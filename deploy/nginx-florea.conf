# Florea behind one public port.
# The API answers /graphql, /uploads and WebSocket upgrades (chat and notification signals); Next.js answers the rest.
# Install: copy to /etc/nginx/sites-available/florea, link it into sites-enabled, then "nginx -t && systemctl reload nginx".

map $http_upgrade $florea_connection {
    default upgrade;
    ''      '';
}

server {
    listen 3001;
    server_name _;

    client_max_body_size 16M;

    location /graphql {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $florea_connection;
        proxy_read_timeout 3600s;

        # the page's WebSocket goes to the API; everything else is a page of the site
        if ($http_upgrade = "websocket") {
            proxy_pass http://127.0.0.1:3007;
        }
        proxy_pass http://127.0.0.1:3002;
    }
}
